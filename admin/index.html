<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Admin · Metallic Ore Limited</title>
  <link rel="icon" href="/assets/logo-mark.png" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <!-- Login -->
  <section class="login" id="loginView" hidden>
    <form class="login__card" id="loginForm">
      <img src="/assets/logo.png" alt="Metallic Ore" />
      <h1>Admin Panel</h1>
      <label>Username<input name="username" autocomplete="username" required /></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required /></label>
      <button class="btn btn--gold" type="submit">Log in</button>
      <p class="err" id="loginErr"></p>
    </form>
  </section>

  <!-- App -->
  <div class="app" id="appView" hidden>
    <aside class="side" id="side">
      <div class="side__brand"><img src="/assets/logo-mark.png" alt="" /><div><b>METALLIC ORE</b><small>Admin Panel</small></div></div>
      <nav id="menu"></nav>
      <div class="side__foot">
        <a href="/" target="_blank" class="side__link">↗ View website</a>
        <button class="side__link" id="logoutBtn">⎋ Log out</button>
      </div>
    </aside>

    <main class="main">
      <header class="top">
        <button class="top__menu" id="menuBtn" aria-label="Menu">☰</button>
        <h2 id="pageTitle">Dashboard</h2>
        <div class="langbar" id="langBar" hidden></div>
        <div class="top__right">
          <span class="dirty" id="dirtyFlag" hidden>● Unsaved changes</span>
          <button class="btn btn--ghost btn--sm" id="discardBtn" hidden>Discard</button>
          <button class="btn btn--gold btn--sm" id="saveBtn" disabled>Save changes</button>
        </div>
      </header>
      <div class="banner" id="pwBanner" hidden>⚠️ You are using the default password. <a href="#account">Change it now</a>.</div>
      <div class="page" id="page"></div>
    </main>
  </div>

  <!-- Media picker modal -->
  <div class="modal" id="mediaModal" hidden>
    <div class="modal__box">
      <div class="modal__head"><h3>Choose from media library</h3><button class="x" data-close>✕</button></div>
      <div class="media-grid" id="pickerGrid"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="admin.js"></script>
</body>
</html>
